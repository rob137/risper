[project]
name = "risper"
version = "0.1.0"
description = "Local-first Ubuntu dictation utility with durable recordings."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
risper = "risper.cli:main"
risper-toggle = "risper.toggle:main"
risper-daemon = "risper.daemon:main"
risper-open = "risper.open:main"
risper-paste-test = "risper.paste_test:main"
risper-history = "risper.history:main"
risper-monitor = "risper.monitor:main"
risper-retranscribe = "risper.retranscribe:main"
risper-models = "risper.model_cli:main"
risper-status = "risper.status_window:main"
risper-benchmark = "risper.benchmark:main"
risper-diagnose = "risper.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = [
  "src/risper",
]
do_not_mutate = [
  "src/risper/__init__.py",
  "src/risper/clipboard.py",
  "src/risper/config.py",
  "src/risper/daemon.py",
  "src/risper/diagnose.py",
  "src/risper/history.py",
  "src/risper/model_cli.py",
  "src/risper/monitor.py",
  "src/risper/open.py",
  "src/risper/paste_test.py",
  "src/risper/overlay.py",
  "src/risper/paste.py",
  "src/risper/platforms/*",
  "src/risper/recorder.py",
  "src/risper/recorders.py",
  "src/risper/retranscribe.py",
  "src/risper/sounds.py",
  "src/risper/status_window.py",
  "src/risper/toggle.py",
  "src/risper/util.py",
]
also_copy = ["scripts/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["--import-mode=importlib"]
